apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conditar-gui-job-runner
  labels:
    app: conditar-gui
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
      - list
