apiVersion: apps/v1
kind: Deployment
metadata:
  name: conditar-gui
  labels:
    app: conditar-gui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: conditar-gui
  template:
    metadata:
      labels:
        app: conditar-gui
    spec:
      serviceAccountName: conditar-gui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gui
          image: conditar-gui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: conditar-gui-config
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: jobs
              mountPath: /data
      volumes:
        - name: jobs
          persistentVolumeClaim:
            claimName: conditar-gui-jobs
